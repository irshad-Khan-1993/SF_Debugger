<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="style.css">
	<title>Salesforce Record</title>
</head>
<body>
	<div class="container">
		<div class="warn_dv hide">
			Works on salesforce domain only.
		</div>
		<div class="saleforce_div hide">
			<div class="list_dv lst_vf_lwc_debug">
				<div class="border-left"></div>
				<div class="border-right"></div>
				<button class="btn btn4 btn_debugger">⚡ LWC & VF Debugger<sup class="sup"> new</sup></button>
				<div class="border-left_2"></div>
				<div class="border-right_2"></div>
			</div>
			<div class="list_dv downloadmetadata">
				<div class="border-left"></div>
				<div class="border-right"></div>
				<button class="btn btn4">Download/View Metadata<sup class="sup"> new</sup></button>
				<div class="border-left_2"></div>
				<div class="border-right_2"></div>
			</div>
			
			
			<div class="list_dv lst_object">
				<div class="border-left"></div>
				<div class="border-right"></div>
				<button class="btn btn2">Objects</button>
				<div class="border-left_2"></div>
				<div class="border-right_2"></div>
			</div>
			<div class="list_dv user">
				<div class="border-left"></div>
				<div class="border-right"></div>
				<button class="btn btn1">User</button>
				<div class="border-left_2"></div>
				<div class="border-right_2"></div>
			</div>
			<div class="list_dv lst_asynjobs">
				<div class="border-left"></div>
				<div class="border-right"></div>
				<button class="btn btn4">Async Apex Jobs</button>
				<div class="border-left_2"></div>
				<div class="border-right_2"></div>
			</div>
			<div class="list_dv logs_list">
				<div class="border-left"></div>
				<div class="border-right"></div>
				<button class="btn btn4">Logs List</button>
				<div class="border-left_2"></div>
				<div class="border-right_2"></div>
			</div>
			<div class="list_dv lst_metadata">
				<div class="border-left"></div>
				<div class="border-right"></div>
				<button class="btn btn3">Metadata</button>
				<div class="border-left_2"></div>
				<div class="border-right_2"></div>
			</div>
			<div class="list_dv lst_record">
				<div class="border-left"></div>
				<div class="border-right"></div>
				<button class="btn btn1">Record</button>
				<div class="border-left_2"></div>
				<div class="border-right_2"></div>
			</div>
			<div class="list_dv lst_records_list">
				<div class="border-left"></div>
				<div class="border-right"></div>
				<button class="btn btn5">Records List</button>
				<div class="border-left_2"></div>
				<div class="border-right_2"></div>
			</div>
			<div class="list_dv lst_bulkupdate">
				<div class="border-left"></div>
				<div class="border-right"></div>
				<button class="btn btn7">Bulk Update</button>
				<div class="border-left_2"></div>
				<div class="border-right_2"></div>
			</div>
			<div class="list_dv lst_users">
				<div class="border-left"></div>
				<div class="border-right"></div>
				<button class="btn btn4">Users List</button>
				<div class="border-left_2"></div>
				<div class="border-right_2"></div>
			</div>
			<div class="list_dv lst_debugs">
				<div class="border-left"></div>
				<div class="border-right"></div>
				<button class="btn btn4">Debug Logs</button>
				<div class="border-left_2"></div>
				<div class="border-right_2"></div>
			</div>
			<div class="list_dv fls_profiles">
				<div class="border-left"></div>
				<div class="border-right"></div>
				<button class="btn btn4">FLS - Profiles</button>
				<div class="border-left_2"></div>
				<div class="border-right_2"></div>
			</div>
			<div class="list_dv fls_permissionsets">
				<div class="border-left"></div>
				<div class="border-right"></div>
				<button class="btn btn4">FLS - PermissionSets</button>
				<div class="border-left_2"></div>
				<div class="border-right_2"></div>
			</div>
			<div class="list_dv lst_objectpermission_permissionsets">
				<div class="border-left"></div>
				<div class="border-right"></div>
				<button class="btn btn4">Object - PermissionSets</button>
				<div class="border-left_2"></div>
				<div class="border-right_2"></div>
			</div>
			<div class="list_dv lst_permissions">
				<div class="border-left"></div>
				<div class="border-right"></div>
				<button class="btn btn4">Permission Sets</button>
				<div class="border-left_2"></div>
				<div class="border-right_2"></div>
			</div>
			
			<div class="list_dv lst_objectpermission_profiles">
				<div class="border-left"></div>
				<div class="border-right"></div>
				<button class="btn btn4">Object - Profiles</button>
				<div class="border-left_2"></div>
				<div class="border-right_2"></div>
			</div>
		</div>
	</div>
	<script type="text/javascript" src="jsforce.min.js"></script>
	<script type="text/javascript" src="script.js"></script>
</body>
</html>
